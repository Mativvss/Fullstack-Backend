spring.application.name=levelup-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/levelup_gamer?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:levelup-gamer-clave-secreta-de-desarrollo-cambiar-en-produccion}
app.jwt.access-minutos=15
app.jwt.refresh-dias=7
app.cors.origenes=http://localhost:3000,http://127.0.0.1:3000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
